databases:
  - name: aiquake-db
    plan: free
    databaseName: aiquake

services:
  - type: web
    name: aiquake-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter   # PyTorch needs more than the 512 MB free tier
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aiquake-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-phi-orcin-93.vercel.app
